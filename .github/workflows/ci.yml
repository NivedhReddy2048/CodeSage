name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The first real models land in phase 1, so the suite is no longer database-free.
    # pgvector's image is used rather than plain postgres so the same extension is
    # available here as in local dev and on Neon.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: codesage
          POSTGRES_PASSWORD: codesage
          POSTGRES_DB: codesage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codesage -d codesage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://codesage:codesage@localhost:5432/codesage
      DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci-32chars
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django system checks
        run: python manage.py check

      - name: Tests
        run: pytest

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
