name: Keep warm

# Pings the Render backend so a webhook never lands on a sleeping service: a free
# web service sleeps after 15 idle minutes, takes ~50 s to wake, and GitHub gives a
# webhook 10 s with no retry (docs/PROJECT_SPEC.md section 15).
#
# Awake window: about 08:00 to 24:00 IST only, every 5 minutes. Cron runs in UTC,
# and IST is UTC+5:30, so the window is 02:30-18:30 UTC:
#
#   30-55/5  2  -> 08:00-08:25 IST
#   */5   3-17  -> 08:30-23:25 IST
#   0-25/5  18  -> 23:30-23:55 IST
#
# The last ping is 23:55 IST; the service sleeps ~15 minutes later. That is about
# 16 h 10 min a day, ~501 instance-hours in a 31-day month, of the account's 750
# shared free hours (docs/DEPLOY.md, "Monthly limits to watch"). Overnight, missed
# webhooks are recovered by the catch-up on the first wake (apps/repos/catchup.py).
#
# GitHub runs schedules best-effort and may start them late; a gap past 15 minutes
# lets the service sleep and the next ping wakes it. Scheduled workflows run from
# the default branch only, and are disabled after 60 days without repository
# activity. tests/test_keep_warm.py checks the window above.

on:
  schedule:
    - cron: "30-55/5 2 * * *"
    - cron: "*/5 3-17 * * *"
    - cron: "0-25/5 18 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /api/health/
    # Pinned, not ubuntu-latest: the label is moving to Ubuntu 26 (GitHub's notice
    # on the first run), and a curl job gains nothing from following it.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        env:
          # A repository variable (Settings > Secrets and variables > Actions >
          # Variables), e.g. https://<service>.onrender.com/api/health/
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::HEALTH_URL is not set; nothing to ping yet."
            exit 0
          fi
          # 90 s covers a cold start (~50 s). The health route never touches the
          # database, so a ping does not wake Neon.
          curl --fail --silent --show-error --max-time 90 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            "$HEALTH_URL"
